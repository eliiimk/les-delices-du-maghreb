<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie Instagram | Les Délices du Maghreb</title>
    <meta name="description" content="Découvrez notre galerie de photos et plongez dans notre ambiance.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/delices.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="delices.html">
                <img src="../img/logo.png" alt="Les Délices du Maghreb" class="logo-img">
            </a>
        </div>
        <nav class="nav">
            <a href="menu.html">Menu</a>
            <a href="galerie.html" class="active">Galerie</a>
            <a href="contact.html">Contact</a>
        </nav>
        <a href="commander.html" class="btn btn-commander">Commander</a>
    </header>

    <main class="galerie-page-main">
        <div class="reservation-nav">
            <a href="delices.html" class="btn-retour">Retour à l'accueil</a>
        </div>

        <section class="gallery-full-section">
            <div class="gallery-header-row" style="margin-top: 2rem;">
                <div>
                    <div class="badge">INSTAGRAM</div>
                    <h1 class="section-title gallery-title">Notre univers en images</h1>
                </div>
                <a href="https://www.instagram.com/lesdelicesdumaghreb78" target="_blank" class="btn btn-insta" style="background-color: transparent; border: 1px solid var(--brand-color); color: var(--brand-color); display: flex; align-items: center; gap: 0.5rem;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    @lesdelicesdumaghreb78
                </a>
            </div>
            
            <p class="subtitle" style="color: var(--text-secondary); margin-bottom: 3rem; font-size: 1.1rem;">
                Suivez-nous sur Instagram pour découvrir nos nouveautés, notre ambiance chaleureuse et nos créations du jour.
            </p>

            <div class="gallery-full-grid">
                <!-- Row 1 -->
                <div class="gallery-item" style="background-image: url('../img/plat-1.png'); aspect-ratio: 1/1;"></div>
                <div class="gallery-item" style="background-image: url('../img/plat-2.png'); aspect-ratio: 1/1;"></div>
                <div class="gallery-item" style="background-image: url('../img/plat-3.png'); aspect-ratio: 1/1;"></div>
                <!-- Row 2 -->
                <div class="gallery-item" style="background-image: url('../img/plat-4.png'); aspect-ratio: 1/1;"></div>
                <div class="gallery-item" style="background-image: url('../img/plat-5.png'); aspect-ratio: 1/1;"></div>
                <div class="gallery-item" style="background-image: url('../img/plat-6.png'); aspect-ratio: 1/1;"></div>
                <!-- Row 3 -->
                <div class="gallery-item" style="background-image: url('../img/plat-7.png'); aspect-ratio: 1/1;"></div>
                <div class="gallery-item" style="background-image: url('../img/plat-8.png'); aspect-ratio: 1/1;"></div>
                <div class="gallery-item" style="background-image: url('../img/plat-9.png'); aspect-ratio: 1/1;"></div>
                <!-- Row 4 -->
                <div class="gallery-item" style="background-image: url('../img/plat-10.png'); aspect-ratio: 1/1;"></div>
                <div class="gallery-item" style="background-image: url('../img/plat-11.png'); aspect-ratio: 1/1;"></div>
                <div class="gallery-item" style="background-image: url('../img/plat-12.png'); aspect-ratio: 1/1;"></div>
            </div>
        </section>
    </main>
</body>
</html>
