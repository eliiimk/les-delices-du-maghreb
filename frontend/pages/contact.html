<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Les Délices du Maghreb</title>
    <meta name="description" content="Contactez Les Délices du Maghreb.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/delices.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="delices.html">
                <img src="../img/logo.png" alt="Les Délices du Maghreb" class="logo-img">
            </a>
        </div>
        <nav class="nav">
            <a href="menu.html">Menu</a>
            <a href="galerie.html">Galerie</a> 
            <a href="contact.html">Contact</a>
        </nav>
        <a href="commander.html" class="btn btn-commander">Commander</a>
    </header>

    <main class="contact-page-main">
        <div class="reservation-nav">
            <a href="delices.html" class="btn-retour">Retour à l'accueil</a>
        </div>

        <div class="contact-card-wrapper">
            <div class="main-contact-card">
                <div class="contact-icon-wrapper">
                    <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                </div>
                <span class="contact-tag">CONTACT DIRECT</span>
                <h1 class="contact-title">Appeler le restaurant</h1>
                
                <div class="contact-inner-card">
                    <span class="inner-tag">TÉLÉPHONE</span>
                    <h2 class="phone-number">+33 1 71 49 80 95</h2>
                    <a href="tel:+33171498095" class="btn-call-action">Lancer l'appel</a>
                </div>

                <div class="contact-footer-info">
                    <div class="info-footer-item">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        <span>10 Rue Jean Jaurès, 78190 Trappes</span>
                    </div>
                    <div class="info-footer-item">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        <div class="hours-block">
                             <span>Mar-Jeu: 11h-15h / 18h-23h</span>
                             <span>Ven-Dim: 11h-23h</span>
                        </div>
                    </div>
                    <div class="info-footer-item">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        <span>Réponse rapide</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
